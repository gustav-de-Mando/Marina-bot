<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Bot Dashboard{% endblock %}</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;background:#0b1020;color:#e8ecf5}a{color:#9aa7ff;text-decoration:none}.top{position:sticky;top:0;background:#11172a;border-bottom:1px solid #26304d;padding:14px 22px;z-index:2}.nav{max-width:1180px;margin:auto;display:flex;gap:16px;align-items:center}.brand{font-weight:800;color:white}.spacer{flex:1}.wrap{max-width:1180px;margin:auto;padding:30px 22px}.hero,.card{background:#131b31;border:1px solid #26304d;border-radius:16px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.btn,button{display:inline-block;background:#5865f2;color:white;border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.secondary{background:#28324f}.muted{color:#9aa6bf}.flash{padding:10px 14px;background:#183d2d;border:1px solid #2c8058;border-radius:9px;margin-bottom:14px}input,textarea,select{width:100%;padding:10px;background:#0c1325;color:#fff;border:1px solid #303b5d;border-radius:8px;margin:5px 0 12px}textarea{min-height:90px;resize:vertical}.toggle{display:flex;gap:9px;align-items:center;margin:9px 0}.toggle input{width:auto;margin:0}.server{display:block;padding:18px;background:#131b31;border:1px solid #26304d;border-radius:12px;margin:10px 0;color:#fff}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.tabs a{padding:9px 12px;background:#202944;border-radius:8px;color:#fff}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #293451;text-align:left}.cmdgrid{columns:3 260px;column-gap:20px}.cmd{break-inside:avoid;padding:7px 0}.danger{background:#b83b4b}
</style></head><body><div class="top"><div class="nav"><a class="brand" href="/">⚙️ All-in-One Bot</a><div class="spacer"></div>{% if session.get('user') %}<span class="muted">{{session.user.username}}</span><a href="/guilds">Server</a><a href="/logout">Logout</a>{% endif %}</div></div><main class="wrap">{% with ms=get_flashed_messages(with_categories=true) %}{% for c,m in ms %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}{% block body %}{% endblock %}</main></body></html>
